name: CI - Django Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Django settings
      DEBUG: "False"
      SECRET_KEY: "test-secret-key-for-ci-only"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      # OpenAI API Key for content moderation 
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      
      # Database settings
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/test_db"
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      
      # Redis/Celery settings
      REDIS_URL: "redis://localhost:6379/0"
      CELERY_BROKER_URL: "redis://localhost:6379/0"
      
      # Disable external services for testing
      AI_MODERATION_ENABLED: "false"
      USE_S3: "false"
      
      # CORS
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Create virtual environment and install dependencies
        working-directory: ./backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          python manage.py test --verbosity=2

      - name: Check for migrations
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          python manage.py makemigrations --check --dry-run

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linting tools
        run: |
          pip install flake8 black isort

      - name: Run flake8
        working-directory: ./backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check code formatting with black
        working-directory: ./backend
        run: |
          black --check --diff .
        continue-on-error: true

      - name: Check import sorting with isort
        working-directory: ./backend
        run: |
          isort --check-only --diff .
        continue-on-error: true

  # ============================================
  # CD - Deployment to DigitalOcean Droplet
  # ============================================
  deploy:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Digital Ocean via Rsync
        uses: easingthemes/ssh-deploy@v5.0.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.DO_HOST }}
          REMOTE_USER: ${{ secrets.DO_USER }}
          
          # ⚠️ TARGET: The path ON THE DROPLET where code lives
          TARGET: "/var/www/olla-lms/backend/" 
          
          # ⚠️ SOURCE: The path IN GITHUB ACTIONS to copy (usually 'backend/' or './')
          # If your django app is inside a folder named 'backend', set this to "backend/"
          SOURCE: "backend/"

          # THE RUTHLESS FILTER:
          # -r: recursive
          # -l: preserve links
          # -g: preserve group
          # -o: preserve owner
          # -D: preserve devices
          # -z: compress during transfer
          # -v: verbose
          # --delete: Delete files on server that are NOT in GitHub (Clean up trash)
          ARGS: "-rlgoDzvc --delete --exclude='.git/' --exclude='.github/' --exclude='tests/' --exclude='*/tests/' --exclude='test_*.py' --exclude='__pycache__/' --exclude='venv/' --exclude='.env' --exclude='*.sqlite3'"

      - name: Post-Deploy Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/olla-lms/backend
            
            # Create venv if it doesn't exist (First run only)
            if [ ! -d "venv" ]; then
                python3 -m venv venv
            fi
            
            source venv/bin/activate
            
            # Install dependencies (only if requirements changed)
            pip install -r requirements.txt
            
            # Run Migrations
            python manage.py migrate --noinput
            
            # Collect Static
            python manage.py collectstatic --noinput
            
            # Restart Gunicorn/Supervisor
            # (Adjust this command to match your actual service name)
            sudo systemctl restart gunicorn || sudo supervisorctl restart all
